# Build debug APK (same path as ci.yml) and attach it to a GitHub Release.
# Stable download URL after the first tag:
#   https://github.com/anatolykabakov/adas/releases/latest/download/app-debug.apk
name: release-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.conan2
            ~/.gradle/caches
          key: apk-${{ hashFiles('app/src/main/cpp/conanfile.py', 'app/build.gradle') }}
          restore-keys: apk-

      - name: conan + ndk
        run: |
          pipx install "conan>=2.0,<3"
          conan profile detect --force
          sdkmanager --install "ndk;26.1.10909125" >/dev/null

      - name: build APK
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: ./scripts/build_project.sh --fetch-best-effort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          # workflow_dispatch without a tag: create/update a draft named "manual"
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}
          draft: ${{ github.ref_type != 'tag' }}
          fail_on_unmatched_files: true
