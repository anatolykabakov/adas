name: deploy-book

on:
  push:
    branches: [main]
    paths:
      - 'docs/book/**'
      - 'docs/book_ru/**'
      - 'docs/build_book.sh'
      - '.github/workflows/book.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r docs/book/requirements.txt

      # Builds both languages into docs/_site: English at the root, Russian under /ru. The script also
      # runs the snippet and translation-sync checks, so a chapter whose examples do not run, or a Russian
      # page whose code has drifted from the English one, fails the deploy instead of shipping.
      - name: Build both language versions
        run: ./docs/build_book.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
