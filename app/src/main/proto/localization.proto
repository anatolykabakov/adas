syntax = "proto3";

package adas.proto;

option java_outer_classname = "LocalizationOuter";

// Online EKF / bicycle-odom localization for bag visualization.
message LocalizationPose {
  int64 timestamp = 1;
  double x = 2;
  double y = 3;
  double yaw = 4;
  double v = 5;
  double yaw_rate = 6;
  double odom_x = 7;
  double odom_y = 8;
  double ekf_x = 9;
  double ekf_y = 10;

  // Road bank, degrees, with its own uncertainty. `paramsd` cannot separate a banked road from an
  // understeering car without this, and upstream's version falls back to "zero with a 10 deg std" when its
  // localizer cannot supply it — so a consumer must gate on `road_roll_std_deg`, not on presence.
  // Measured accuracy: 2.2 deg per sample, 0.65 deg after ten seconds of averaging, which is where it
  // stops improving because the residual is the road's own camber changing. See utils/road_roll_estimator.h
  // and scripts/bag/bag_road_roll.py.
  double road_roll_deg = 11;
  double road_roll_std_deg = 12;
  bool road_roll_valid = 13;

  // Vehicle parameters learned online (utils/params_learner.h). These are reported, not necessarily used:
  // `localization.learn_vehicle_params` gates the learner and `lane_keep.use_learned_params` gates the
  // controller, separately, so a drive can log the learned value against the configured one before anything
  // depends on it.
  double learned_stiffness_factor = 14;
  double learned_steer_ratio = 15;
  double learned_angle_offset_deg = 16;
  double learned_stiffness_std = 17;
  double learned_steer_ratio_std = 18;
  bool learned_params_valid = 19;
  int32 learned_sample_count = 20;
}
