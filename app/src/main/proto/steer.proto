syntax = "proto3";

package adas.proto;

option java_outer_classname = "SteerOuter";

// Desired lateral command for CarController (not a raw CAN frame).
message SteerCommand {
  // Assist torque in cNm, signed. Left = negative. Clamp ±300.
  int32 torque_cnm = 1;
  // When false (or torque==0), CarController stays in HCA standby.
  bool enabled = 2;
  // Provenance for latency (BOOTTIME ms).
  int64 vision_ts_ms = 3;    // ONNX done
  int64 chassis_ts_ms = 4;
  int64 publish_ts_ms = 5;
  int64 capture_ts_ms = 6;   // camera frame arrival — e2e pipeline start

  // Состояние закона управления. Жило в LaneKeepDebug, пока управление считал планер; после переезда
  // в Control это единственный источник: кто скомандовал, тот и рассказывает, из чего команда вышла.
  double desired_swa_deg = 7;
  double actual_swa_deg = 8;
  double angle_error_deg = 9;
  double steer_norm = 10;
  double pid_p = 11;
  double pid_i = 12;
  double pid_f = 13;
  bool slew_clipped = 14;
  bool assist_allowed = 15;
  bool assist_known = 16;
  // Почему команда снята: ok | stale | blinker | no_assist | статус плана.
  string status = 17;

  // Намерение, а не кадры: борт сам решит, как это уложить в шину и когда машина готова слушать.
  bool hud_left_lane_visible = 19;
  bool hud_right_lane_visible = 20;
  // 21 was the cruise-button intent; the longitudinal axis now goes the standard way, below.
  reserved 21;

  // Продольная команда — тем же путём, что поперечная: планер даёт план, закон управления даёт
  // ускорение, платформа кладёт его в свои кадры. Никаких кнопок.
  bool long_active = 22;
  // Requested acceleration [m/s²], already inside the platform envelope (VW: −3.5 … 2.0).
  double accel_ms2 = 23;
  // 0 off, 1 pid, 2 stopping, 3 starting — upstream's LongCtrlState.
  int32 long_state = 24;
  // The plan's speed for this tick [m/s] and the set speed [m/s], for the HUD and the bag.
  double v_target_mps = 25;
  double v_cruise_mps = 26;
  // Why the longitudinal command is off: ok | no_plan | stale | no_controls | gas | brake | no_cruise.
  string long_status = 27;
}
