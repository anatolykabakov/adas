plugins {
    id 'com.android.application'
    id 'com.google.protobuf'
}

// Override: ./gradlew assembleDebug -PsupercomboModel=/path/to.onnx
def supercomboSrc = file(findProperty('supercomboModel')
        ?: "${rootProject.projectDir}/models/supercombo_097_fp32.onnx")
def supercomboDst = file("${projectDir}/src/main/assets/supercombo.onnx")

tasks.register('syncSupercomboModel', Copy) {
    description = 'Copy models/supercombo_097_fp32.onnx → assets/supercombo.onnx for APK'
    onlyIf {
        if (!supercomboSrc.isFile()) {
            logger.warn("supercombo source missing: ${supercomboSrc} — keeping existing assets/supercombo.onnx")
            return false
        }
        return true
    }
    from supercomboSrc
    into supercomboDst.parentFile
    rename { 'supercombo.onnx' }
    outputs.file(supercomboDst)
    doFirst {
        logger.lifecycle("Packaging supercombo: ${supercomboSrc} → ${supercomboDst}")
    }
}

// OSM road map for the `map_data` service (docs/MAP_CURVATURE.md). Built by
// scripts/mapmatch/osm_graph.py; 4.9 MB, ~3.3 MB once the APK compresses it.
// Override: ./gradlew assembleDebug -ProadMap=/path/to.admap
def roadMapSrc = file(findProperty('roadMap') ?: "${rootProject.projectDir}/maps/Moscow.osm.admap")
def roadMapDst = file("${projectDir}/src/main/assets/Moscow.osm.admap")

tasks.register('syncRoadMap', Copy) {
    description = 'Copy maps/Moscow.osm.admap → assets/Moscow.osm.admap for APK'
    onlyIf {
        if (!roadMapSrc.isFile()) {
            logger.warn("road map missing: ${roadMapSrc} — keeping existing assets/Moscow.osm.admap " +
                    "(map_data node will stay idle without it)")
            return false
        }
        return true
    }
    from roadMapSrc
    into roadMapDst.parentFile
    rename { 'Moscow.osm.admap' }
    outputs.file(roadMapDst)
    doFirst {
        logger.lifecycle("Packaging road map: ${roadMapSrc} → ${roadMapDst}")
    }
}

// MIT and the other permissive licences require their notice to travel with **every copy**, and an APK is
// a copy: the repository's NOTICE alone does not cover someone who only ever downloads the app. Copied at
// build time rather than committed, so there is one source of truth and it cannot drift.
def noticeSrc = file("${rootProject.projectDir}/NOTICE")
def noticeDst = file("${projectDir}/src/main/assets/NOTICE.txt")

tasks.register('syncNotice', Copy) {
    description = 'Copy NOTICE → assets/NOTICE.txt so the licence notices ship inside the APK'
    onlyIf {
        if (!noticeSrc.isFile()) {
            throw new GradleException("NOTICE is missing at ${noticeSrc} — the APK may not be distributed " +
                    "without the third-party notices it carries")
        }
        return true
    }
    from noticeSrc
    into noticeDst.parentFile
    rename { 'NOTICE.txt' }
    outputs.file(noticeDst)
}

tasks.named('preBuild').configure {
    dependsOn('syncSupercomboModel', 'syncTrafficYoloModel', 'syncRoadMap', 'syncNotice')
}

// The traffic detector is deliberately NOT committed under assets/: it is derived from Ultralytics
// YOLOv8, which ships under AGPL-3.0, and putting it in the APK is distribution (THIRD_PARTY.md).
// The task below still packages it when the file is present in models/ — that is an opt-in for whoever
// has settled the licence, not something a plain checkout does. On the phone /sdcard/adas_models/ works
// too, without rebuilding.
def trafficYoloSrc = file(findProperty('trafficYoloModel')
        ?: "${rootProject.projectDir}/models/yolov8n_traffic_256.onnx")
if (!trafficYoloSrc.isFile()) {
    trafficYoloSrc = file("${rootProject.projectDir}/models/yolov8n_traffic_320.onnx")
}
def trafficYoloDst = file("${projectDir}/src/main/assets/traffic_yolo.onnx")

tasks.register('syncTrafficYoloModel', Copy) {
    description = 'Copy models/yolov8n_traffic_256.onnx (or _320) → assets/traffic_yolo.onnx'
    onlyIf {
        if (!trafficYoloSrc.isFile()) {
            logger.lifecycle("traffic YOLO not packaged (none in models/) — the node is off by default; " +
                    "adb push to /sdcard/adas_models/traffic_yolo.onnx to use it")
            return false
        }
        return true
    }
    from trafficYoloSrc
    into trafficYoloDst.parentFile
    rename { 'traffic_yolo.onnx' }
    outputs.file(trafficYoloDst)
    doFirst {
        logger.lifecycle("Packaging traffic YOLO: ${trafficYoloSrc} → ${trafficYoloDst}")
    }
}

android {
    namespace 'adas.app'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "adas.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libprotobuf.so'
        pickFirst '**/libprotobuf-lite.so'
        pickFirst '**/libprotoc.so'
        pickFirst '**/libzmq.so'
        pickFirst 'META-INF/LICENSE'
        pickFirst 'META-INF/LICENSE.txt'
        pickFirst 'META-INF/DEPENDENCIES'
        exclude 'META-INF/native-image/**'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'com.google.protobuf:protobuf-java:3.24.4'
    implementation 'com.google.protobuf:protobuf-java-util:3.24.4'
    implementation 'org.zeromq:jeromq:0.6.0'
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'org.slf4j:slf4j-simple:1.7.30'

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.3'
    implementation 'org.opencv:opencv:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.24.4'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}
